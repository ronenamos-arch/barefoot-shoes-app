<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <script>
      (function() {
        try {
          var target = window.hasOwnProperty('fetch') ? window : Window.prototype;
          var originalFetch = window.fetch;
          if (originalFetch) {
            var descriptor = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (!descriptor || descriptor.configurable) {
              var currentFetch = originalFetch;
              Object.defineProperty(target, 'fetch', {
                get: function() { return currentFetch; },
                set: function(val) { currentFetch = val; },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          console.warn("Could not patch window.fetch:", e);
        }
      })();
    </script>
